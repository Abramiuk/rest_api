services:
  db:
    image: postgres:15-alpine
    container_name: library3_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=library3
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: library3_api
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/library3
    depends_on:
      - db
